<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>MUPI UTEC</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
    touch-action:pan-y;
}

.slider{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

.slides{
    display:flex;
    width:400%;
    height:100%;
    transition:transform 0.8s ease-in-out;
}

.slide{
    width:100vw;
    height:100vh;
    flex-shrink:0;
    position:relative;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
}

/* Overlay elegante */
.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.05)
    );
}

/* Indicadores */
.indicators{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:20;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:rgba(255,255,255,0.4);
    transition:0.3s;
}

.dot.active{
    background:white;
    transform:scale(1.2);
}

/* Texto modo interactivo */
.interaction-message{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.5);
    color:white;
    padding:10px 18px;
    border-radius:30px;
    font-size:14px;
    z-index:50;
    opacity:0;
    transition:0.4s;
    backdrop-filter:blur(10px);
}

.interaction-message.show{
    opacity:1;
}

</style>
</head>
<body>

<div class="slider">

    <div class="interaction-message" id="message">
        Modo interactivo activado
    </div>

    <div class="slides" id="slides">

        <div class="slide">
            <img src="slide1.jpg" alt="">
            <div class="overlay"></div>
        </div>

        <div class="slide">
            <img src="slide2.jpg" alt="">
            <div class="overlay"></div>
        </div>

        <div class="slide">
            <img src="slide3.jpg" alt="">
            <div class="overlay"></div>
        </div>

        <div class="slide">
            <img src="slide4.jpg" alt="">
            <div class="overlay"></div>
        </div>

    </div>

    <div class="indicators">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

</div>

<script>

const slides = document.getElementById("slides");
const dots = document.querySelectorAll(".dot");
const message = document.getElementById("message");

let current = 0;
let autoplay;
let inactivityTimer;

const totalSlides = 4;

/* CAMBIAR SLIDE */
function goToSlide(index){

    current = index;

    if(current >= totalSlides){
        current = 0;
    }

    if(current < 0){
        current = totalSlides - 1;
    }

    slides.style.transform =
        `translateX(-${current * 100}vw)`;

    updateDots();
}

/* INDICADORES */
function updateDots(){

    dots.forEach(dot =>
        dot.classList.remove("active")
    );

    dots[current].classList.add("active");
}

/* AUTOPLAY */
function startAutoplay(){

    clearInterval(autoplay);

    autoplay = setInterval(() => {

        goToSlide(current + 1);

    }, 6000);
}

/* PAUSAR */
function stopAutoplay(){
    clearInterval(autoplay);
}

/* REANUDAR POR INACTIVIDAD */
function resetInactivity(){

    clearTimeout(inactivityTimer);

    inactivityTimer = setTimeout(() => {

        startAutoplay();

        message.classList.remove("show");

    }, 15000);
}

/* ACTIVAR MODO INTERACTIVO */
function activateInteraction(){

    stopAutoplay();

    message.classList.add("show");

    resetInactivity();
}

/* TOUCH SWIPE */
let startX = 0;
let endX = 0;

document.addEventListener("touchstart", (e)=>{

    startX = e.touches[0].clientX;

    activateInteraction();

});

document.addEventListener("touchmove", (e)=>{

    endX = e.touches[0].clientX;

});

document.addEventListener("touchend", ()=>{

    let diff = startX - endX;

    if(diff > 50){
        goToSlide(current + 1);
    }

    if(diff < -50){
        goToSlide(current - 1);
    }

});

/* CLICK */
document.addEventListener("click", ()=>{

    activateInteraction();

});

/* INICIO */
startAutoplay();

</script>

</body>
</html>
